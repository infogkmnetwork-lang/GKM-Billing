name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0d3b7a' --iconBackgroundColorDark '#0d3b7a'

      - name: Add native print bridge
        run: cp native/MainActivity.java android/app/src/main/java/com/gkmnetworks/admin/MainActivity.java

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GKM-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
